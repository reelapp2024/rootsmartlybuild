# Railway / Nixpacks — monorepo root (do NOT set a subdirectory Root Directory)
# Each Railway service overrides Build + Start; install always runs from this root.

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
# Full workspace install so @geniebuild / @schema/core resolve for Next/Vite apps
cmds = ["pnpm install --frozen-lockfile=false"]
